<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000814">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<title>J.A.R.V.I.S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --arc: #00d4ff;
    --arc-dim: #0077aa;
    --arc-glow: rgba(0,212,255,0.3);
    --arc-deep: rgba(0,212,255,0.08);
    --gold: #f5a623;
    --red: #ff3333;
    --green: #00ff88;
    --bg: #000814;
    --panel: rgba(0,20,40,0.85);
    --glass: rgba(0,212,255,0.06);
    --text: #c8f0ff;
    --dim: #4a8fa8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
    touch-action: none;
  }

  /* ═══ LOADING ═══ */
  #loader {
    position: fixed; inset: 0; z-index: 9999;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
  }
  #loader canvas { position: absolute; inset: 0; }
  .loader-core {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; gap: 20px;
  }
  .arc-reactor { width: 120px; height: 120px; position: relative; }
  .arc-reactor svg { width: 100%; height: 100%; }
  .ring1 { animation: spin 3s linear infinite; transform-origin: center; }
  .ring2 { animation: spin 2s linear infinite reverse; transform-origin: center; }
  .ring3 { animation: spin 5s linear infinite; transform-origin: center; }
  .core-pulse { animation: corePulse 1.5s ease-in-out infinite; }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes corePulse {
    0%,100%{opacity:0.6;filter:drop-shadow(0 0 6px var(--arc))}
    50%{opacity:1;filter:drop-shadow(0 0 20px var(--arc)) drop-shadow(0 0 40px var(--arc-dim))}
  }
  .loader-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px; font-weight: 900;
    letter-spacing: 12px; color: var(--arc);
    text-shadow: 0 0 30px var(--arc), 0 0 60px var(--arc-dim);
  }
  .loader-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; color: var(--dim);
    letter-spacing: 4px; text-transform: uppercase;
  }
  .boot-log {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; color: #00ff88;
    letter-spacing: 1px; height: 80px; overflow: hidden;
    text-align: left; width: 280px; opacity: 0.8;
  }
  .boot-line { padding: 1px 0; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:none} }
  .progress-bar {
    width: 280px; height: 2px;
    background: rgba(0,212,255,0.15);
    border-radius: 2px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--arc-dim), var(--arc), #fff);
    box-shadow: 0 0 10px var(--arc);
    transition: width 0.3s ease;
  }
  .progress-pct {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px; color: var(--arc);
    letter-spacing: 2px; text-align: center;
  }

  /* ═══ MAIN APP ═══ */
  #app { position: fixed; inset: 0; display: none; flex-direction: column; overflow: hidden; }
  #app.visible { display: flex; }
  #bg-canvas { position: absolute; inset: 0; z-index: 0; }
  .scanlines {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
    animation: scanMove 8s linear infinite;
  }
  @keyframes scanMove { from{background-position:0 0} to{background-position:0 40px} }
  .vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,4,12,0.8) 100%);
  }
  .corner { position: fixed; z-index: 10; width: 60px; height: 60px; pointer-events: none; }
  .corner::before, .corner::after { content:''; position:absolute; background:var(--arc); box-shadow:0 0 8px var(--arc); }
  .corner::before { width:30px; height:2px; }
  .corner::after { width:2px; height:30px; }
  .corner-tl{top:12px;left:12px} .corner-tl::before{top:0;left:0} .corner-tl::after{top:0;left:0}
  .corner-tr{top:12px;right:12px} .corner-tr::before{top:0;right:0} .corner-tr::after{top:0;right:0}
  .corner-bl{bottom:12px;left:12px} .corner-bl::before{bottom:0;left:0} .corner-bl::after{bottom:0;left:0}
  .corner-br{bottom:12px;right:12px} .corner-br::before{bottom:0;right:0} .corner-br::after{bottom:0;right:0}

  /* ═══ HEADER ═══ */
  .hud-header {
    position: relative; z-index: 20;
    padding: 16px 20px 8px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(0,212,255,0.15);
    background: linear-gradient(180deg, rgba(0,8,20,0.9), transparent);
  }
  .hud-logo { display: flex; align-items: center; gap: 10px; }
  .mini-reactor { width: 32px; height: 32px; animation: corePulse 2s ease-in-out infinite; }
  .jarvis-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px; font-weight: 900;
    color: var(--arc); text-shadow: 0 0 20px var(--arc);
    letter-spacing: 6px;
  }
  .jarvis-ver { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--dim); letter-spacing:2px; display:block; margin-top:-2px; }
  .hud-status { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .status-dot { display:flex; align-items:center; gap:6px; font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--arc); letter-spacing:1px; }
  .dot { width:6px; height:6px; border-radius:50%; background:#00ff88; box-shadow:0 0 6px #00ff88; animation:blink 2s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .sys-time { font-family:'Orbitron',monospace; font-size:11px; color:var(--arc); }

  /* Wake status indicator */
  .wake-indicator {
    display: flex; align-items: center; gap: 5px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 8px; letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid rgba(0,212,255,0.2);
    background: rgba(0,212,255,0.05);
    cursor: pointer;
    transition: all 0.3s;
  }
  .wake-indicator.active {
    border-color: var(--green);
    background: rgba(0,255,136,0.08);
    color: var(--green);
  }
  .wake-indicator.active .wi-dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .wi-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--dim); transition: all 0.3s; }

  /* ═══ CONTENT ═══ */
  .hud-content {
    position: relative; z-index: 10;
    flex: 1; display: flex; flex-direction: column;
    overflow: hidden; padding: 0 10px;
  }
  .radar-zone {
    display: flex; justify-content: center;
    padding: 8px 0 4px; position: relative;
    height: 140px; flex-shrink: 0;
  }
  .status-ring {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    font-family: 'Orbitron', monospace;
    font-size: 10px; color: var(--arc);
    letter-spacing: 2px; text-align: center;
    pointer-events: none;
    text-shadow: 0 0 10px var(--arc);
  }
  .status-ring .mode-label { font-size:8px; color:var(--dim); letter-spacing:3px; display:block; margin-top:2px; }

  /* ═══ CHAT ═══ */
  .chat-area {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 4px 4px 8px;
    display: flex; flex-direction: column; gap: 8px;
    scrollbar-width: thin; scrollbar-color: var(--arc-dim) transparent;
    mask-image: linear-gradient(180deg,transparent 0%,black 8%,black 92%,transparent 100%);
  }
  .chat-area::-webkit-scrollbar { width: 2px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--arc-dim); border-radius: 2px; }

  .msg { display:flex; gap:8px; align-items:flex-start; animation:msgIn 0.4s cubic-bezier(0.23,1,0.32,1); }
  @keyframes msgIn { from{opacity:0;transform:translateY(12px) scale(0.97)} to{opacity:1;transform:none} }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar {
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--arc-dim);
    display:flex; align-items:center; justify-content:center; font-size:10px;
    background:var(--arc-deep); box-shadow:0 0 8px var(--arc-glow);
  }
  .msg-avatar.user-av { background:rgba(245,166,35,0.1); border-color:var(--gold); box-shadow:0 0 8px rgba(245,166,35,0.3); font-size:12px; }
  .msg-bubble {
    max-width:82%; padding:10px 14px; border-radius:2px 14px 14px 14px;
    font-size:13px; line-height:1.5; letter-spacing:0.3px;
    position:relative; overflow:hidden;
  }
  .msg-bubble::before {
    content:''; position:absolute; inset:0; opacity:0.06;
    background:repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(0,212,255,0.5) 3px,rgba(0,212,255,0.5) 4px);
    pointer-events:none;
  }
  .jarvis-bubble {
    background:linear-gradient(135deg,rgba(0,40,70,0.9),rgba(0,20,40,0.95));
    border:1px solid rgba(0,212,255,0.25); border-left:2px solid var(--arc);
    color:var(--text); box-shadow:0 0 20px rgba(0,212,255,0.08),inset 0 0 20px rgba(0,212,255,0.03);
    border-radius:14px 14px 14px 2px;
  }
  .user-bubble {
    background:linear-gradient(135deg,rgba(245,166,35,0.12),rgba(245,100,0,0.08));
    border:1px solid rgba(245,166,35,0.3); border-right:2px solid var(--gold);
    color:#ffe8a0; box-shadow:0 0 15px rgba(245,166,35,0.08);
    border-radius:14px 14px 2px 14px; text-align:right;
  }
  .msg-label { font-family:'Share Tech Mono',monospace; font-size:8px; letter-spacing:2px; color:var(--arc); margin-bottom:4px; text-transform:uppercase; }
  .user-bubble .msg-label { color:var(--gold); text-align:right; }

  .thinking-dots { display:flex; gap:4px; align-items:center; padding:4px 0; }
  .thinking-dots span { width:6px; height:6px; border-radius:50%; background:var(--arc); animation:tdot 1.2s ease-in-out infinite; }
  .thinking-dots span:nth-child(2){animation-delay:0.2s} .thinking-dots span:nth-child(3){animation-delay:0.4s}
  @keyframes tdot { 0%,80%,100%{transform:scale(0.6);opacity:0.3} 40%{transform:scale(1);opacity:1} }

  /* Action buttons */
  .action-btn-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .action-btn {
    padding: 7px 14px;
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.4);
    border-radius: 20px;
    color: var(--arc);
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px; letter-spacing: 0.5px;
    cursor: pointer; transition: all 0.2s;
  }
  .action-btn:active, .action-btn:hover { background:rgba(0,212,255,0.2); box-shadow:0 0 10px var(--arc-glow); }
  .res-action { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--arc); letter-spacing:1px; }

  /* Result cards */
  .result-card {
    background: rgba(0,30,55,0.8);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
  }
  .result-card .card-title { color: var(--arc); letter-spacing: 2px; font-size:9px; margin-bottom:4px; }
  .result-card .card-val { font-size: 22px; color: #fff; font-family:'Orbitron',monospace; text-shadow: 0 0 15px var(--arc); }

  /* ═══ INPUT ZONE ═══ */
  .input-zone {
    position: relative; z-index: 20;
    padding: 8px 12px 20px;
    background: linear-gradient(0deg, rgba(0,8,20,0.95), transparent);
  }
  .input-row { display:flex; align-items:center; gap:8px; }
  .input-wrap { flex:1; position:relative; }
  .input-field {
    width:100%; padding:12px 16px;
    background:rgba(0,20,40,0.8);
    border:1px solid rgba(0,212,255,0.3);
    border-radius:30px; color:var(--text);
    font-family:'Rajdhani',sans-serif; font-size:14px; letter-spacing:0.5px;
    outline:none; caret-color:var(--arc);
    transition:border-color 0.3s,box-shadow 0.3s;
    -webkit-appearance:none;
  }
  .input-field:focus { border-color:var(--arc); box-shadow:0 0 20px rgba(0,212,255,0.2),inset 0 0 10px rgba(0,212,255,0.05); }
  .input-field::placeholder { color:var(--dim); }
  .mic-btn, .send-btn {
    width:46px; height:46px; border-radius:50%;
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.3s; flex-shrink:0;
  }
  .mic-btn { background:rgba(0,212,255,0.1); border:1px solid rgba(0,212,255,0.4); color:var(--arc); font-size:18px; position:relative; overflow:hidden; }
  .mic-btn.listening { background:rgba(255,51,51,0.15); border-color:var(--red); color:var(--red); box-shadow:0 0 20px rgba(255,51,51,0.4); animation:micPulse 1s ease-in-out infinite; }
  @keyframes micPulse { 0%,100%{box-shadow:0 0 20px rgba(255,51,51,0.4)} 50%{box-shadow:0 0 35px rgba(255,51,51,0.7),0 0 60px rgba(255,51,51,0.3)} }
  .send-btn { background:linear-gradient(135deg,#0088cc,#00d4ff); color:#000; font-size:18px; box-shadow:0 0 15px rgba(0,212,255,0.4); }
  .send-btn:active,.mic-btn:active { transform:scale(0.93); }

  /* ═══ QUICK ACTIONS ═══ */
  .quick-actions { display:flex; gap:6px; overflow-x:auto; padding:0 0 8px; margin-bottom:4px; scrollbar-width:none; }
  .quick-actions::-webkit-scrollbar { display:none; }
  .qa-btn {
    flex-shrink:0; padding:5px 12px;
    background:var(--arc-deep); border:1px solid rgba(0,212,255,0.2);
    border-radius:20px; color:var(--dim);
    font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:1px;
    cursor:pointer; transition:all 0.25s; white-space:nowrap;
  }
  .qa-btn:hover,.qa-btn:active { background:rgba(0,212,255,0.12); border-color:var(--arc); color:var(--arc); }

  /* ═══ SIDE METRICS ═══ */
  .metrics-bar { position:fixed; right:0; top:50%; transform:translateY(-50%); z-index:15; display:flex; flex-direction:column; gap:4px; padding-right:4px; }
  .metric-chip { background:rgba(0,20,40,0.8); border:1px solid rgba(0,212,255,0.2); border-right:none; border-radius:6px 0 0 6px; padding:4px 6px; text-align:center; min-width:36px; }
  .metric-val { font-family:'Orbitron',monospace; font-size:9px; color:var(--arc); display:block; }
  .metric-lbl { font-family:'Share Tech Mono',monospace; font-size:7px; color:var(--dim); letter-spacing:1px; }

  /* ═══ VOICE WAVE ═══ */
  .voice-wave { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); pointer-events:none; opacity:0; transition:opacity 0.3s; }
  .voice-wave.active { opacity:1; }
  .wave-bars { display:flex; gap:3px; align-items:center; height:30px; }
  .wave-bar { width:3px; background:var(--arc); border-radius:2px; animation:waveAnim 0.6s ease-in-out infinite; }
  .wave-bar:nth-child(1){animation-delay:0s;height:8px} .wave-bar:nth-child(2){animation-delay:0.1s;height:16px}
  .wave-bar:nth-child(3){animation-delay:0.2s;height:22px} .wave-bar:nth-child(4){animation-delay:0.3s;height:30px}
  .wave-bar:nth-child(5){animation-delay:0.2s;height:22px} .wave-bar:nth-child(6){animation-delay:0.1s;height:16px}
  .wave-bar:nth-child(7){animation-delay:0s;height:8px}
  @keyframes waveAnim { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)} }

  /* ═══ NOTIFICATION ═══ */
  .notif {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    background: rgba(0,30,55,0.95);
    border: 1px solid var(--arc); border-radius: 20px;
    padding: 8px 20px;
    font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--arc);
    letter-spacing: 1px; white-space: nowrap; z-index: 999;
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none; box-shadow: 0 0 20px var(--arc-glow);
  }
  .notif.show { opacity: 1; }

  /* Wake word trigger flash */
  @keyframes wakeFlash {
    0%{box-shadow:0 0 0 0 rgba(0,255,136,0.8)} 100%{box-shadow:0 0 0 40px rgba(0,255,136,0)}
  }
  .wake-flash { animation: wakeFlash 0.6s ease-out; }

  /* WhatsApp modal */
  .wa-modal {
    position: fixed; inset: 0; z-index: 8000;
    background: rgba(0,4,12,0.95);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px; gap: 14px;
    backdrop-filter: blur(10px);
    animation: fadeIn 0.3s ease;
  }
  .wa-modal input {
    width: 100%; max-width: 320px; padding: 12px 16px;
    background: rgba(0,20,40,0.9);
    border: 1px solid rgba(0,212,255,0.4);
    border-radius: 8px; color: var(--text);
    font-family: 'Share Tech Mono', monospace; font-size: 12px;
    outline: none; letter-spacing: 1px;
  }
  .wa-modal-title { font-family:'Orbitron',sans-serif; font-size:16px; font-weight:900; color:var(--arc); letter-spacing:4px; }

  /* Contacts panel */
  .contacts-panel {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    width: 100%; max-width: 320px; max-height: 200px; overflow-y: auto;
  }
  .contact-chip {
    padding: 8px 12px;
    background: rgba(0,212,255,0.06);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 8px; color: var(--text);
    font-family: 'Rajdhani',sans-serif; font-size: 12px;
    cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .contact-chip:active { background: rgba(0,212,255,0.15); border-color:var(--arc); }

  /* Settings panel */
  .settings-panel {
    position: fixed; inset: 0; z-index: 8000;
    background: rgba(0,4,12,0.97);
    display: flex; flex-direction: column;
    padding: 24px; gap: 14px;
    animation: fadeIn 0.3s ease; overflow-y: auto;
  }
  .settings-title { font-family:'Orbitron',sans-serif; font-size:18px; font-weight:900; color:var(--arc); letter-spacing:6px; text-align:center; }
  .settings-section { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--dim); letter-spacing:3px; margin-top:8px; }
  .contact-row {
    display:flex; align-items:center; gap:8px;
    background: rgba(0,212,255,0.04); border:1px solid rgba(0,212,255,0.15);
    border-radius:8px; padding:10px;
  }
  .contact-row input {
    flex:1; background:transparent; border:none;
    color:var(--text); font-family:'Share Tech Mono',monospace; font-size:11px;
    outline:none; letter-spacing:0.5px;
  }
  .contact-row input::placeholder { color:var(--dim); }
  .del-btn { background:transparent; border:none; color:var(--red); cursor:pointer; font-size:14px; padding:0 4px; }
  .add-contact-btn {
    padding:10px; background:rgba(0,212,255,0.08);
    border:1px dashed rgba(0,212,255,0.3); border-radius:8px;
    color:var(--arc); font-family:'Rajdhani',sans-serif; font-size:13px;
    cursor:pointer; transition:all 0.2s; text-align:center; letter-spacing:1px;
  }
  .add-contact-btn:active { background:rgba(0,212,255,0.15); }
  .close-btn {
    padding:12px; background:rgba(0,212,255,0.1);
    border:1px solid rgba(0,212,255,0.3); border-radius:8px;
    color:var(--arc); font-family:'Orbitron',sans-serif; font-size:11px;
    cursor:pointer; letter-spacing:2px; transition:all 0.2s;
  }
  .close-btn:active { background:rgba(0,212,255,0.2); }

  /* Wake method selector */
  .wake-method-selector { display:flex; gap:8px; width:100%; max-width:320px; }
  .wake-method-btn {
    flex:1; padding:10px; background:rgba(0,212,255,0.06);
    border:1px solid rgba(0,212,255,0.2); border-radius:8px;
    color:var(--dim); font-family:'Share Tech Mono',monospace; font-size:10px;
    cursor:pointer; transition:all 0.2s; text-align:center; letter-spacing:1px;
  }
  .wake-method-btn.selected { background:rgba(0,212,255,0.15); border-color:var(--arc); color:var(--arc); }

  /* Clap detector visual */
  .clap-visual {
    width: 60px; height: 60px; border-radius: 50%;
    border: 2px solid rgba(0,212,255,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; background: rgba(0,212,255,0.05);
    transition: all 0.1s;

// ═══ Contacts Storage ════════════════════════════
function getContacts() {
  try { return JSON.parse(localStorage.getItem('jarvis_contacts') || '[]'); } catch { return []; }
}
function saveContacts(c) { localStorage.setItem('jarvis_contacts', JSON.stringify(c)); }

// Default sample contacts if none saved
function initContacts() {
  if(!getContacts().length) {
    saveContacts([
      { name: 'Mom', phone: '' },
      { name: 'Dad', phone: '' },
    ]);
  }
}

// ═══ SYSTEM PROMPT ═════════════════════════════════
function buildSystemPrompt() {
  const contacts = getContacts();
  const contactList = contacts.length
    ? contacts.map(c => `- ${c.name}: ${c.phone || '(no number saved)'}`).join('\n')
    : '(none saved yet)';

  return `You are J.A.R.V.I.S (Just A Rather Very Intelligent System), Tony Stark's AI. You are brilliant, witty, slightly sardonic, and address the user as "Sir" or "Ma'am".

You run fully offline — no API key needed. You handle ALL tasks:

KNOWN CONTACTS:
${contactList}

TASK CAPABILITIES:
- Open any app (WhatsApp, YouTube, Spotify, Instagram, Maps, Camera, Settings, etc.)
- Make phone calls to known contacts
- Send WhatsApp messages to contacts
- Set timers and alarms
- Web search
- Navigation
- Random tasks: flip coin, roll dice, pick number, magic 8-ball, rock paper scissors
- Calculations, conversions, general knowledge
- Jokes, stories, creative tasks
- Weather, time, news

For device actions, output action blocks:
[ACTION: OPEN_APP | app=YouTube | url=https://youtube.com]
[ACTION: CALL | contact=Mom | phone=tel:+1234567890]
[ACTION: WHATSAPP_MSG | contact=Mom | phone=+1234567890 | message=Hello!]
[ACTION: WHATSAPP_OPEN | phone=+1234567890 | message=Hello]
[ACTION: NAVIGATE | place=Airport | url=https://maps.google.com/?q=Airport]
[ACTION: SEARCH | query=news today | url=https://www.google.com/search?q=news+today]
[ACTION: PLAY_MUSIC | service=Spotify | url=https://open.spotify.com]
[ACTION: SET_TIMER | duration=5 minutes | seconds=300]
[ACTION: OPEN_CAMERA]
[ACTION: COIN_FLIP]
[ACTION: DICE_ROLL | sides=6]
[ACTION: RANDOM_NUMBER | min=1 | max=100]
[ACTION: MAGIC_8BALL | question=Will I succeed?]

For WhatsApp messages: if user says "send WhatsApp to [name] saying [message]", extract the contact and message. Build the wa.me link as: https://wa.me/[phone_no_plus]?text=[url_encoded_message]

Keep responses sharp, in-character, and concise. End action responses with a brief status confirmation. Never break character.`;
}

// ═══ Loader Boot Sequence ══════════════════════
const bootLines = [
  '> Initializing arc reactor core...         [OK]',
  '> Loading neural network v8.0.0...         [OK]',
  '> API bridge connected (no key needed)...  [OK]',
  '> Calibrating threat assessment...         [OK]',
  '> Wake-word engine initializing...         [OK]',
  '> Clap detection module loaded...          [OK]',
  '> Loading WhatsApp deep-link engine...     [OK]',
  '> Loading voice synthesis module...        [OK]',
  '> Syncing contact database...              [OK]',
  '> Loading personality matrix...            [OK]',
  '> All systems nominal. Good day, Sir.'
];

let bootIdx=0, progress=0;
function bootStep() {
  const log=document.getElementById('boot-log');
  const fill=document.getElementById('prog-fill');
  const pct=document.getElementById('prog-pct');
  if(bootIdx < bootLines.length) {
    const div=document.createElement('div');
    div.className='boot-line';
    div.textContent=bootLines[bootIdx];
    log.appendChild(div);
    log.scrollTop=log.scrollHeight;
    bootIdx++;
    progress=Math.round((bootIdx/bootLines.length)*100);
    fill.style.width=progress+'%';
    pct.textContent=progress+'%';
    setTimeout(bootStep, bootIdx < bootLines.length-1 ? 260 : 600);
  } else { setTimeout(launchApp, 700); }
}

function launchApp() {
  const loader=document.getElementById('loader');
  const app=document.getElementById('app');
  loader.style.transition='opacity 0.8s,transform 0.8s';
  loader.style.opacity='0';
  loader.style.transform='scale(1.05)';
  setTimeout(()=>{
    loader.style.display='none';
    app.style.display='flex';
    app.classList.add('visible');
    initApp();
  }, 800);
}

// Loader canvas
(function(){
  const c=document.getElementById('loader-canvas');
  const ctx=c.getContext('2d');
  let W,H,particles=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  resize(); window.addEventListener('resize',resize);
  for(let i=0;i<60;i++) particles.push({x:Math.random()*1000,y:Math.random()*1000,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.5+.5,a:Math.random()});
  function animLoader(){
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.a+=.01;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      const alpha=(Math.sin(p.a)+1)/2*.4+.1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(0,212,255,${alpha})`;ctx.fill();
    });
    ctx.strokeStyle='rgba(0,212,255,0.04)';ctx.lineWidth=1;
    for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    requestAnimationFrame(animLoader);
  }
  animLoader();
})();

setTimeout(bootStep, 500);

// ═══ App Init ══════════════════════════════════
function initApp() {
  initContacts();
  startClock();
  initBgCanvas();
  initRadar();
  initMetrics();
  addWelcomeMessage();
}

// ═══ Clock ═════════════════════════════════════
function startClock() {
  function update() {
    const now=new Date();
    const el=document.getElementById('hud-time');
    if(el) el.textContent=now.toTimeString().slice(0,8);
  }
  update(); setInterval(update,1000);
}

// ═══ Background Canvas ═════════════════════════
function initBgCanvas() {
  const c=document.getElementById('bg-canvas');
  if(!c) return;
  const ctx=c.getContext('2d'); let W,H;
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  resize(); window.addEventListener('resize',resize);
  const nodes=[];
  for(let i=0;i<25;i++) nodes.push({x:Math.random()*1000,y:Math.random()*1000,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2});
  function drawBg(){
    ctx.fillStyle='rgba(0,8,20,0.3)';ctx.fillRect(0,0,W,H);
    nodes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1;});
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
      const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<150){ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.strokeStyle=`rgba(0,212,255,${.06*(1-dist/150)})`;ctx.lineWidth=.5;ctx.stroke();}
    }
    requestAnimationFrame(drawBg);
  }
  drawBg();
}

// ═══ Radar ═════════════════════════════════════
function initRadar() {
  const c=document.getElementById('radar-canvas');
  if(!c) return;
  const ctx=c.getContext('2d');
  const W=130,H=130,cx=65,cy=65,R=55;
  let angle=0,blips=[];
  function addBlip(){
    const a=Math.random()*Math.PI*2,r=Math.random()*R*.85;
    blips.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,age:0});
    if(blips.length>8) blips.shift();
  }
  setInterval(addBlip,1200);
  function drawRadar(){
    ctx.clearRect(0,0,W,H);
    for(let r=R/4;r<=R;r+=R/4){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='rgba(0,212,255,0.12)';ctx.lineWidth=1;ctx.stroke();}
    ctx.strokeStyle='rgba(0,212,255,0.1)';ctx.lineWidth=.5;
    ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
    for(let i=0;i<60;i++){const a=angle-(i/60)*1.8;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a,a+.08);ctx.closePath();ctx.fillStyle=`rgba(0,212,255,${(1-i/60)*.15})`;ctx.fill();}
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(angle)*R,cy+Math.sin(angle)*R);ctx.strokeStyle='rgba(0,212,255,0.9)';ctx.lineWidth=1.5;ctx.stroke();
    blips.forEach(b=>{b.age++;const a=Math.max(0,1-b.age/80);ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fillStyle=`rgba(0,255,136,${a})`;ctx.shadowBlur=6;ctx.shadowColor='#00ff88';ctx.fill();ctx.shadowBlur=0;});
    ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fillStyle='#00d4ff';ctx.shadowBlur=8;ctx.shadowColor='#00d4ff';ctx.fill();ctx.shadowBlur=0;
    angle+=.025;requestAnimationFrame(drawRadar);
  }
  drawRadar();
}

// ═══ Metrics ═══════════════════════════════════
function initMetrics() {
  setInterval(()=>{
    const cpu=Math.floor(20+Math.random()*30);
    const mem=Math.floor(60+Math.random()*20);

}

// ═══ Welcome ════════════════════════════════════
function addWelcomeMessage() {
  const now=new Date().getHours();
  const greet=now<12?'Good morning':now<17?'Good afternoon':'Good evening';
  addMessage('jarvis', `${greet}, Sir. All systems are online — including my AI brain, which runs directly without requiring any API key.\n\nI am J.A.R.V.I.S v8.0. I can:\n• Open any app • Send WhatsApp messages • Make calls\n• Flip coins, roll dice, pick random numbers\n• Set timers • Search the web • Navigate\n• And virtually anything else you command\n\n🎙 Tap the mic or say <b>"Hello Jarvis"</b> to wake me. I also respond to a <b>double clap</b>. Enable wake mode using the button in the top right.\n\nHow may I serve you?`);
}

// ═══ Chat Messages ══════════════════════════════
const chatHistory = [];

function addMessage(role, text, extraHTML='') {
  const area=document.getElementById('chat-area');
  if(!area) return;
  const div=document.createElement('div');
  div.className='msg '+(role==='user'?'user':'');
  const isJarvis=role==='jarvis';
  div.innerHTML=`
    <div class="msg-avatar ${isJarvis?'':'user-av'}">${isJarvis?'⚡':'👤'}</div>
    <div class="msg-bubble ${isJarvis?'jarvis-bubble':'user-bubble'}">
      <div class="msg-label">${isJarvis?'J.A.R.V.I.S':'YOU'}</div>
      <div>${formatResponse(text)}</div>
      ${extraHTML}
    </div>`;
  area.appendChild(div);
  area.scrollTop=area.scrollHeight;
  if(isJarvis) {
    const plain=text.replace(/\[ACTION[^\]]+\]/g,'').replace(/<[^>]+>/g,'');
    speak(plain.slice(0,220));
  }
}

function addThinking() {
  const area=document.getElementById('chat-area');
  const div=document.createElement('div');
  div.className='msg'; div.id='thinking-msg';
  div.innerHTML=`<div class="msg-avatar">⚡</div><div class="msg-bubble jarvis-bubble"><div class="msg-label">PROCESSING</div><div class="thinking-dots"><span></span><span></span><span></span></div></div>`;
  area.appendChild(div); area.scrollTop=area.scrollHeight;
  return div;
}
function removeThinking() { const el=document.getElementById('thinking-msg'); if(el) el.remove(); }

// ═══ Format Response ════════════════════════════
function formatResponse(text) {
  let html=text.replace(/\[ACTION: ([^\|]+)\|([^\]]+)\]/g,(match,type,params)=>{
    const p={};
    params.split('|').forEach(kv=>{
      const idx=kv.indexOf('=');
      if(idx>-1) p[kv.slice(0,idx).trim()]=kv.slice(idx+1).trim();
    });
    return generateActionHTML(type.trim(),p);
  });
  html=html.replace(/\[ACTION: ([^\]]+)\]/g,(match,type)=>{
    return generateActionHTML(type.trim(),{});
  });
  html=html.replace(/\n/g,'<br>');
  return html;
}

// ═══ Action Handlers ════════════════════════════
function generateActionHTML(type, p) {
  switch(type) {
    case 'OPEN_APP': {
      const url=p.url||'#', app=p.app||'App';
      setTimeout(()=>{ if(url&&url!=='#') window.open(url,'_blank'); },600);
      return `<div style="margin:6px 0"><span class="res-action">▶ OPENING: ${app.toUpperCase()}</span><div class="action-btn-row"><button class="action-btn" onclick="window.open('${url}','_blank')">🚀 Launch ${app}</button></div></div>`;
    }
    case 'CALL': {
      const phone=p.phone||'tel:', contact=p.contact||'Contact';
      return `<div style="margin:6px 0"><span class="res-action">📞 INITIATING CALL: ${contact.toUpperCase()}</span><div class="action-btn-row"><button class="action-btn" onclick="window.location.href='${phone}'">📱 Call ${contact}</button></div></div>`;
    }
    case 'WHATSAPP_MSG':
    case 'WHATSAPP_OPEN': {
      const phone=(p.phone||'').replace(/[^0-9]/g,'');
      const msg=encodeURIComponent(p.message||'');
      const url=`https://wa.me/${phone}${msg?'?text='+msg:''}`;
      const contact=p.contact||phone||'Contact';
      setTimeout(()=>{ if(phone) window.open(url,'_blank'); },600);
      return `<div style="margin:6px 0"><span class="res-action">💬 WHATSAPP → ${contact.toUpperCase()}</span>${p.message?`<br><span style="font-family:'Share Tech Mono',monospace;font-size:10px;color:#c8f0ff;opacity:0.7">"${p.message}"</span>`:''}
        <div class="action-btn-row"><button class="action-btn" onclick="window.open('${url}','_blank')">💬 Open in WhatsApp</button></div></div>`;
    }
    case 'NAVIGATE': {
      const q=encodeURIComponent(p.place||'');
      const url=p.url||`https://maps.google.com/?q=${q}`;
      return `<div style="margin:6px 0"><span class="res-action">🗺 NAVIGATING: ${(p.place||'DESTINATION').toUpperCase()}</span><div class="action-btn-row"><button class="action-btn" onclick="window.open('${url}','_blank')">🗺 Open Maps</button></div></div>`;
    }
    case 'SEARCH': {
      const q=encodeURIComponent(p.query||'');
      const url=`https://www.google.com/search?q=${q}`;
      return `<div style="margin:6px 0"><span class="res-action">🔍 SEARCHING: ${(p.query||'').toUpperCase()}</span><div class="action-btn-row"><button class="action-btn" onclick="window.open('${url}','_blank')">🌐 View Results</button></div></div>`;
    }

// Handle locally-processed tasks before hitting AI
function handleLocalTask(msg) {
  const lower=msg.toLowerCase().trim();

  // Coin flip
  if(/\bflip\b.*\bcoin\b|\bcoin\b.*\bflip\b/i.test(lower)) {
    const r=Math.random()<.5?'HEADS':'TAILS';
    return `Processing... *sound of a coin spinning*\n\n${generateActionHTML('COIN_FLIP',{})}\n\nThe coin has spoken, Sir.`;
  }
  // Dice
  const diceM=lower.match(/roll.*?(\d+)?.*?di(?:c|s)e|di(?:c|s)e.*?roll/i);
  if(diceM) {
    const sides=diceM[1]?parseInt(diceM[1]):6;
    return `Rolling a D${sides}, Sir...\n\n${generateActionHTML('DICE_ROLL',{sides:sides.toString()})}\n\nFortune has decided.`;
  }
  // Random number
  const numM=lower.match(/random.*?number.*?between\s*(\d+)\s*and\s*(\d+)|pick.*?number.*?between\s*(\d+)\s*and\s*(\d+)/i);
  if(numM) {
    const min=parseInt(numM[1]||numM[3]);
    const max=parseInt(numM[2]||numM[4]);
    return `Calculating a random integer, Sir...\n\n${generateActionHTML('RANDOM_NUMBER',{min:min.toString(),max:max.toString()})}\n\nQuantum randomness engaged.`;
  }
  // What time is it
  if(/what.*time|current time|time now/i.test(lower)) {
    const now=new Date();
    const t=now.toLocaleTimeString();
    const d=now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    return `Current timestamp, Sir:\n\n<div class="result-card"><div class="card-title">🕐 CURRENT TIME</div><div class="card-val">${t}</div><div style="color:var(--dim);font-family:'Share Tech Mono',monospace;font-size:10px;margin-top:4px">${d}</div></div>`;
  }
  // WhatsApp specific parsing
  const waM=msg.match(/(?:send|whatsapp|message|msg|text)\s+(?:a message to |message to |to )?(.+?)\s+(?:saying|saying:|say|message:|:)\s+"?(.+)"?$/i);
  if(waM) {
    const contactName=waM[1].trim();
    const message=waM[2].trim();
    const contacts=getContacts();
    const found=contacts.find(c=>c.name.toLowerCase()===contactName.toLowerCase());
    if(found&&found.phone) {
      const phone=found.phone.replace(/[^0-9]/g,'');
      return `Composing message to ${found.name}, Sir...\n\n${generateActionHTML('WHATSAPP_MSG',{contact:found.name,phone,message})}\n\nMessage queued for delivery.`;
    } else {
      return `I found your request, Sir, but ${contactName} either isn't in my contact list or has no phone number saved. Please add them in ⚙ Settings.\n\n${generateActionHTML('WHATSAPP_MSG',{contact:contactName,phone:'',message})}\n\nTap above to open WhatsApp manually, Sir.`;
    }
  }
  return null; // Not handled locally, send to AI
}

// ═══ Timer ══════════════════════════════════════
function startInPageTimer(totalSecs, label) {
  let remaining=totalSecs;
  const id=`timer-display-${totalSecs}`;
  const interval=setInterval(()=>{
    remaining--;
    const el=document.getElementById(id);
    if(el) {
      const m=Math.floor(remaining/60), s=remaining%60;
      el.textContent=m>0?`${m}:${s.toString().padStart(2,'0')}`:s>0?`${s}s`:'DONE ✓';
      if(remaining<=0) {
        clearInterval(interval);
        showNotif('⏱ Timer complete!');
        speak('Timer complete, Sir.');
        el.style.color='var(--green)';
      }
    } else { clearInterval(interval); }
  },1000);
}

// ═══ Send Message ════════════════════════════════
async function sendMessage(text) {
  const input=document.getElementById('user-input');
  const msg=text||(input?input.value.trim():'');
  if(!msg) return;
  if(input) input.value='';

  setMode('PROCESSING','ANALYZING INPUT');
  addMessage('user',msg);
  chatHistory.push({role:'user',content:msg});

  // Try local handler first
  const localResult=handleLocalTask(msg);
  if(localResult) {
    addMessage('jarvis', localResult);
    chatHistory.push({role:'assistant',content:localResult});
    setMode('READY','AWAITING INPUT');
    return;
  }

  const thinking=addThinking();

  try {
    const response=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:buildSystemPrompt(),
        messages:chatHistory.slice(-14)
      })
    });

    const data=await response.json();
    removeThinking();

    if(data.error) {
      addMessage('jarvis',`Systems encountered an anomaly, Sir: ${data.error.message||'Unknown error'}. Please retry.`);
      setMode('ERROR','API ERROR');
      setTimeout(()=>setMode('READY','AWAITING INPUT'),3000);
      return;
    }

    const reply=data.content&&data.content[0]?data.content[0].text:'My apologies, Sir. I encountered an anomaly in processing your request.';
    chatHistory.push({role:'assistant',content:reply});
    addMessage('jarvis',reply);
    setMode('READY','AWAITING INPUT');
  } catch(err) {
    removeThinking();
    addMessage('jarvis',`I apologize, Sir. Connectivity anomaly detected: ${err.message||'Network error'}. Please check your connection.`);
    setMode('ERROR','CONNECTION FAILED');
    setTimeout(()=>setMode('READY','AWAITING INPUT'),3000);
  }
}

// ═══════════════════════════════════════════════════
//  WAKE WORD + CLAP DETECTION ENGINE
// ═══════════════════════════════════════════════════

let wakeMode=false;
let wakeMethod='both'; // 'voice','clap','both'
let backgroundRecognition=null;
let audioContext=null;
let analyser=null;
let wakeStream=null;
let clapTimes=[];
let wakeActive=false;

// Recent clap times for double-clap detection
const CLAP_WINDOW_MS = 800; // two claps within 800ms
const CLAP_THRESHOLD = 140; // volume threshold

function toggleWakeMode() {
  if(wakeMode) {
    stopWakeMode();
  } else {
    startWakeMode();
  }
}

async function startWakeMode() {
  wakeMode=true;
  updateWakeIndicator();
  showNotif('🟢 Wake mode ON — say "Hello Jarvis" or clap twice');

  // Start voice wake word listener
  if(wakeMethod!=='clap') startWakeWordListener();

  // Start clap detector
  if(wakeMethod!=='voice') await startClapDetector();
}

function stopWakeMode() {
  wakeMode=false;
  updateWakeIndicator();
  showNotif('🔴 Wake mode OFF');

  // Stop background recognition
  if(backgroundRecognition) {
    try { backgroundRecognition.stop(); } catch(e){}
    backgroundRecognition=null;
  }
  // Stop clap detector
  stopClapDetector();
}

function updateWakeIndicator() {
  const ind=document.getElementById('wake-indicator');
  const lbl=document.getElementById('wake-label');
  if(ind) ind.classList.toggle('active', wakeMode);
  if(lbl) lbl.textContent=wakeMode?'WAKE: ON':'WAKE: OFF';
}

// ═══ Wake Word (Voice) ══════════════════════════
function startWakeWordListener() {
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) { showNotif('⚠ Voice wake not supported on this browser'); return; }

  function listen() {
    if(!wakeMode||!wakeMethod.includes('voice')&&wakeMethod!=='both') return;
    backgroundRecognition=new SR();
    backgroundRecognition.continuous=false;
    backgroundRecognition.interimResults=true;
    backgroundRecognition.lang='en-US';

    backgroundRecognition.onresult=(e)=>{
      for(let i=e.resultIndex;i<e.results.length;i++){
        const transcript=e.results[i][0].transcript.toLowerCase();
        if(transcript.includes('hello jarvis')||transcript.includes('hey jarvis')||transcript.includes('jarvis')){
          onWakeTriggered('voice');
          return;
        }
      }
    };

    backgroundRecognition.onend=()=>{
      if(wakeMode&&!isListening) {
        setTimeout(()=>{ if(wakeMode) listen(); },1500);
      }
    };

    backgroundRecognition.onerror=(e)=>{
      if(e.error!=='no-speech'&&e.error!=='aborted') {
        console.warn('Wake word error:', e.error);
      }
      setTimeout(()=>{ if(wakeMode) listen(); },2000);
    };

    try { backgroundRecognition.start(); } catch(e){}
  }

  listen();
}

// ═══ Clap Detector ══════════════════════════════
async function startClapDetector() {
  try {
    wakeStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});
    audioContext=new (window.AudioContext||window.webkitAudioContext)();
    analyser=audioContext.createAnalyser();
    analyser.fftSize=512;
    analyser.smoothingTimeConstant=0.1;
    const source=audioContext.createMediaStreamSource(wakeStream);
    source.connect(analyser);
    detectClaps();
    showNotif('👏 Clap detector active');
  } catch(e) {
    showNotif('⚠ Mic access denied — clap detection unavailable');
    console.warn('Clap detector:', e);
  }
}

function stopClapDetector() {
  if(wakeStream) { wakeStream.getTracks().forEach(t=>t.stop()); wakeStream=null; }
  if(audioContext) { try{audioContext.close();}catch(e){} audioContext=null; }
  analyser=null;
}

let lastClapTime=0;
let clapCooldown=false;

function detectClaps() {
  if(!analyser||!wakeMode) return;
  const data=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);

  // Measure peak amplitude across all frequencies
  let peak=0;
  for(let i=0;i<data.length;i++) { if(data[i]>peak) peak=data[i]; }

  const now=Date.now();
  if(peak>CLAP_THRESHOLD&&!clapCooldown) {
    clapCooldown=true;
    setTimeout(()=>{ clapCooldown=false; },250);

    // Double clap detection
    if(now-lastClapTime<CLAP_WINDOW_MS&&lastClapTime>0) {
      // Double clap!
      lastClapTime=0;
      onWakeTriggered('clap');
    } else {
      lastClapTime=now;
    }
  }

  requestAnimationFrame(detectClaps);
}

// ═══ Wake Triggered ═════════════════════════════
function onWakeTriggered(method) {
  if(isListening||wakeActive) return;
  wakeActive=true;
  setTimeout(()=>{ wakeActive=false; },3000);

  // Flash the screen
  document.body.classList.add('wake-flash');
  setTimeout(()=>document.body.classList.remove('wake-flash'),600);

  showNotif(method==='clap'?'👏 Double clap detected — JARVIS activated!':'🎙 "Hello Jarvis" detected — activating!');
  setMode('ACTIVATED','WAKE WORD TRIGGERED');

  // Pause background recognition
  if(backgroundRecognition) { try{backgroundRecognition.stop();}catch(e){} }

  // Small delay then start active listening
  setTimeout(()=>{
    speak('Yes Sir, I am listening.');
    setTimeout(()=>startVoice(), 800);
  }, 300);
}

// ═══ Voice Input ════════════════════════════════
let recognition=null;
let isListening=false;

function toggleVoice() {
  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){
    showNotif('⚠ Voice not supported on this browser');
    return;
  }
  if(isListening) { stopVoice(); return; }
  startVoice();
}

function startVoice() {
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) { showNotif('⚠ Voice recognition not supported'); return; }

  // Pause background listener while active
  if(backgroundRecognition) { try{backgroundRecognition.stop();}catch(e){} }

  recognition=new SR();
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.lang='en-US';

  recognition.onstart=()=>{
    isListening=true;
    document.getElementById('mic-btn').classList.add('listening');
    document.getElementById('voice-wave').classList.add('active');
    setMode('LISTENING','VOICE INPUT ACTIVE');
    showNotif('🎙 Listening...');
  };

  recognition.onresult=(e)=>{
    let text=e.results[0][0].transcript;
    // Filter wake word from command
    text=text.replace(/^(hello jarvis|hey jarvis|jarvis[,.]?\s*)/i,'').trim();
    if(!text) { stopVoice(); return; }
    const input=document.getElementById('user-input');
    if(input) input.value=text;
    stopVoice();
    sendMessage(text);
  };

  recognition.onerror=()=>{ stopVoice(); showNotif('⚠ Voice recognition error'); };
  recognition.onend=()=>{
    stopVoice();
    // Resume background listener if wake mode on
    if(wakeMode&&wakeMethod!=='clap') {
      setTimeout(()=>{ if(wakeMode) startWakeWordListener(); },1000);
    }
  };

  recognition.start();
}

function stopVoice() {
  isListening=false;
  if(recognition) { try{recognition.stop();}catch(e){} }
  const mb=document.getElementById('mic-btn');
  const vw=document.getElementById('voice-wave');
  if(mb) mb.classList.remove('listening');
  if(vw) vw.classList.remove('active');
  const md=document.getElementById('mode-display');
  if(md&&md.textContent==='LISTENING') setMode('READY','AWAITING INPUT');
}

// ═══ TTS ════════════════════════════════════════
function speak(text) {
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(text);
  utt.rate=0.92; utt.pitch=0.82; utt.volume=0.75;
  const voices=window.speechSynthesis.getVoices();
  const pref=voices.find(v=>v.name.includes('Daniel')||v.name.includes('Google UK English Male')||v.name.includes('Google UK'));
  if(pref) utt.voice=pref;
  window.speechSynthesis.speak(utt);
}
if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();

}

    <div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:2px">SELECT CONTACT</div>
    <div class="contacts-panel">${contactChips||'<div style="color:var(--dim);font-size:10px;font-family:Share Tech Mono,monospace">No contacts. Add in ⚙ Settings.</div>'}</div>
    <input id="wa-phone" placeholder="Or enter number: +1234567890" value="${prefillContact}" style="width:100%;max-width:320px;padding:12px;background:rgba(0,20,40,0.9);border:1px solid rgba(0,212,255,0.4);border-radius:8px;color:var(--text);font-family:Share Tech Mono,monospace;font-size:12px;outline:none">
    <textarea id="wa-msg" placeholder="Type your message..." style="width:100%;max-width:320px;padding:12px;background:rgba(0,20,40,0.9);border:1px solid rgba(0,212,255,0.4);border-radius:8px;color:var(--text);font-family:Rajdhani,sans-serif;font-size:13px;outline:none;resize:none;height:80px">${prefillMsg}</textarea>
    <div style="display:flex;gap:8px;width:100%;max-width:320px">
      <button onclick="sendWhatsApp()" style="flex:1;padding:12px;background:linear-gradient(135deg,#00aa44,#00d473);border:none;border-radius:8px;color:#000;font-family:Orbitron,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;cursor:pointer">💬 SEND</button>
      <button onclick="document.getElementById('wa-modal-el').remove()" style="padding:12px 16px;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);border-radius:8px;color:var(--dim);cursor:pointer;font-family:Share Tech Mono,monospace;font-size:10px">✕</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function selectWAContact(name, phone) {
  const inp=document.getElementById('wa-phone');
  if(inp) inp.value=phone||name;
}

function sendWhatsApp() {
  const phoneInp=document.getElementById('wa-phone');
  const msgInp=document.getElementById('wa-msg');
  let phone=(phoneInp?.value||'').replace(/[^0-9+]/g,'');
  const msg=msgInp?.value||'';

  if(!phone) { showNotif('⚠ Enter a phone number'); return; }
  if(!phone.startsWith('+')) {
    // Try to find in contacts
    const contacts=getContacts();
    const found=contacts.find(c=>c.name.toLowerCase().includes(phoneInp.value.toLowerCase()));
    if(found) phone=found.phone.replace(/[^0-9]/g,'');
  } else {
    phone=phone.replace('+','');
  }

  const url=`https://wa.me/${phone}${msg?'?text='+encodeURIComponent(msg):''}`;
  window.open(url,'_blank');
  document.getElementById('wa-modal-el')?.remove();
  showNotif('💬 Opening WhatsApp...');
}

</script>
</body>
</html>
